spring.application.name=orchestrator-agent
server.port=${PORT:8080}
server.servlet.context-path=/orchestrator-agent
agents.urls=${AGENT_URLS:http://localhost:8081}
spring.main.lazy-initialization=true

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen2.5}
spring.ai.ollama.chat.options.temperature=0.0

# Comma separated browser origins allowed to call the API, e.g. https://my-planner.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
