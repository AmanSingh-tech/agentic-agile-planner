# Local infrastructure for the Agentic Agile Planner.
# Ollama runs on the host (ollama serve) so it can use local models / GPU.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agile-planner-pgvector
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: ${DB_USER:-testuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testpwd}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-testuser} -d vectordb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector-data:
